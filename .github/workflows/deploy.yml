# GitHub Actions Workflow to Automatically Deploy Inside English v2.0 to GitHub Pages
# This enables a fully functional static interactive demo at:
# https://akoffice933-maker.github.io/inside-english-v2/

name: Deploy Static Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queue.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages Metadata
        uses: actions/configure-pages@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        # We temporarily inject environment variables to configure Static Export & basePath.
        # This compiles the entire app into a fully-functional offline-safe static build.
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="https://mock.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="mock-key"
          npx next build
        env:
          # Sets base path matching your repository name for GitHub Pages nested pathing
          NEXT_PUBLIC_BASE_PATH: "/inside-english-v2"

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Uploads the generated Next.js static output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Status Log
        run: echo "🎉 Demo deployed successfully to GitHub Pages!"
